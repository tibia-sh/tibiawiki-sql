name: Alert

# Tells the maintainer when a run of the release, release PR or upstream check workflow did not pass. It comments
# `<workflow> <conclusion>: <run url>` on the open issue titled `Automation needs a look`, or opens that issue assigned
# to drptbl. workflow_run matches a workflow by its name:, so the names below are release.yml's, release-pr.yml's and
# upstream.yml's. A pull request runs none of them, and one never alerts. Runs of every workflow that writes the issue
# share the concurrency group automation-alert, wait for each other and are never replaced, so no alert is dropped and
# no second issue is opened.
on:
  workflow_run:
    workflows: [Release, Release PR, Upstream check]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  alert:
    if: github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.conclusion != 'neutral' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: automation-alert
      cancel-in-progress: false
      queue: max
    steps:
      # No checkout: gh alone, on this repository, with GITHUB_TOKEN. The event's fields reach the shell through env.
      # The issue is found by its exact title in the open issues, not by a search, whose index can lag behind an issue
      # opened moments ago.
      - name: Comment on the issue, or open it
        run: |
          title='Automation needs a look'
          body="$WORKFLOW $CONCLUSION: $RUN_URL"
          number=$(TITLE=$title gh issue list --state open --limit 1000 --json number,title \
            --jq 'map(select(.title == env.TITLE) | .number) | min // empty')
          if [[ -n $number ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --assignee drptbl --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
