name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' tibiawikisql/__init__.py)"
          if [[ ! "$version" =~ ^[0-9A-Za-z.+!-]+$ ]]; then
            echo "::error::tibiawikisql/__init__.py must set __version__ exactly once, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION"
            exit 1
          fi
      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Install
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION"
          uv pip install -e '.[testing]'
      - name: Test
        run: .venv/bin/python -m unittest discover

  release:
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # sign the build provenance attestations
      attestations: write # store the attestations
    env:
      UV_PYTHON: "3.10"
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Cut the release notes
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $VERSION" '
            index($0, "## ") == 1 {
              if (found) exit
              if ($0 == heading || index($0, heading " ") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no entries under ## $VERSION"
            exit 1
          fi
          cat "$notes"
      - name: Build
        id: build
        run: |
          uv build --build-constraints build-constraints.txt --require-hashes --out-dir dist
          wheel="tibiawikisql-${VERSION}-py3-none-any.whl"
          sdist="tibiawikisql-${VERSION}.tar.gz"
          expected="$(printf '%s\n' "$wheel" "$sdist" | sort)"
          actual="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            printf '::error::dist/ holds:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          echo "wheel=dist/$wheel" >> "$GITHUB_OUTPUT"
          echo "sdist=dist/$sdist" >> "$GITHUB_OUTPUT"
      - name: Write SHA256SUMS
        env:
          WHEEL: ${{ steps.build.outputs.wheel }}
          SDIST: ${{ steps.build.outputs.sdist }}
        run: |
          cd dist
          sha256sum "$(basename "$WHEEL")" "$(basename "$SDIST")" > SHA256SUMS
          cat SHA256SUMS
      - name: Check the installed wheel
        env:
          WHEEL: ${{ steps.build.outputs.wheel }}
        run: |
          venv="$RUNNER_TEMP/wheel-venv"
          uv venv "$venv"
          uv pip install --python "$venv" "$WHEEL"
          output="$("$venv/bin/tibiawikisql" --version)"
          echo "$output"
          if [[ "$output" != *"$VERSION"* ]]; then
            echo "::error::tibiawikisql --version does not report $VERSION"
            exit 1
          fi
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.build.outputs.wheel }}
            ${{ steps.build.outputs.sdist }}
            dist/SHA256SUMS
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WHEEL: ${{ steps.build.outputs.wheel }}
          SDIST: ${{ steps.build.outputs.sdist }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$WHEEL" "$SDIST" dist/SHA256SUMS \
            --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
