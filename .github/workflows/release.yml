name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress: false lets a running release finish. GitHub keeps one pending run per group, so a newer run
# for the same ref still replaces a run of that ref that is waiting to start.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the dry run is on main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run the dry run on main, not $GITHUB_REF"
            exit 1
          fi
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' tibiawikisql/__init__.py)"
          if [[ ! "$version" =~ ^[0-9A-Za-z.+!-]+$ ]]; then
            echo "::error::tibiawikisql/__init__.py must set __version__ exactly once, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION"
            exit 1
          fi
      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Install
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION"
          uv pip install -e '.[testing]'
      - name: Test
        run: .venv/bin/python -m unittest discover

  # The same build and wheel check as ci.yml's build job. It installs the runtime dependencies from PyPI, so it runs
  # here, without the release job's write and OIDC permissions.
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.10"
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Build
        id: build
        run: |
          uv build --build-constraints build-constraints.txt --require-hashes --no-create-gitignore --out-dir dist
          wheel="tibiawikisql-${VERSION}-py3-none-any.whl"
          sdist="tibiawikisql-${VERSION}.tar.gz"
          expected="$(printf '%s\n' "$wheel" "$sdist" | sort)"
          actual="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            printf '::error::dist/ holds:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          echo "wheel=dist/$wheel" >> "$GITHUB_OUTPUT"
          echo "sdist=dist/$sdist" >> "$GITHUB_OUTPUT"
      - name: Check the installed wheel
        env:
          WHEEL: ${{ steps.build.outputs.wheel }}
        run: |
          venv="$RUNNER_TEMP/wheel-venv"
          uv venv "$venv"
          uv pip install --python "$venv" "$WHEEL"
          output="$("$venv/bin/tibiawikisql" --version)"
          echo "$output"
          if [[ "$output" != *"$VERSION"* ]]; then
            echo "::error::tibiawikisql --version does not report $VERSION"
            exit 1
          fi

  # Runs only the pinned uv, the setuptools build pinned by hash in build-constraints.txt and the Python standard
  # library. Nothing from PyPI is installed or imported here.
  release:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # sign the build provenance attestations
      attestations: write # store the attestations
    outputs:
      published: ${{ steps.publish.outputs.published }} # 'true' once the release and its assets are uploaded
    env:
      UV_PYTHON: "3.10"
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Cut the release notes
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## $VERSION" '
            index($0, "## ") == 1 {
              if (found) exit
              if ($0 == heading || index($0, heading " ") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no entries under ## $VERSION"
            exit 1
          fi
          cat "$notes"
      - name: Build
        id: build
        run: |
          uv build --build-constraints build-constraints.txt --require-hashes --no-create-gitignore --out-dir dist
          wheel="tibiawikisql-${VERSION}-py3-none-any.whl"
          sdist="tibiawikisql-${VERSION}.tar.gz"
          expected="$(printf '%s\n' "$wheel" "$sdist" | sort)"
          actual="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "$actual" != "$expected" ]; then
            printf '::error::dist/ holds:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          echo "wheel=dist/$wheel" >> "$GITHUB_OUTPUT"
          echo "sdist=dist/$sdist" >> "$GITHUB_OUTPUT"
      - name: Write SHA256SUMS
        env:
          WHEEL: ${{ steps.build.outputs.wheel }}
          SDIST: ${{ steps.build.outputs.sdist }}
        run: |
          cd dist
          sha256sum "$(basename "$WHEEL")" "$(basename "$SDIST")" > SHA256SUMS
          cat SHA256SUMS
      - name: Check the wheel metadata
        env:
          WHEEL: ${{ steps.build.outputs.wheel }}
        run: |
          python3 -I - <<'PY'
          import os
          import sys
          import zipfile
          from email.parser import HeaderParser

          wheel = os.environ["WHEEL"]
          version = os.environ["VERSION"]
          with zipfile.ZipFile(wheel) as archive:
              names = [n for n in archive.namelist() if n.count("/") == 1 and n.endswith(".dist-info/METADATA")]
              if len(names) != 1:
                  sys.exit(f"::error::{wheel} holds {len(names)} .dist-info/METADATA files, expected 1")
              metadata = HeaderParser().parsestr(archive.read(names[0]).decode("utf-8"))
          versions = metadata.get_all("Version") or []
          print(f"{names[0]}: Version {versions}")
          if versions != [version]:
              sys.exit(f"::error::{wheel} METADATA Version {versions} does not equal __version__ {version}")
          if os.environ["GITHUB_EVENT_NAME"] == "push" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              sys.exit(f"::error::tag {os.environ['GITHUB_REF_NAME']} does not match METADATA Version {version}")
          PY
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.build.outputs.wheel }}
            ${{ steps.build.outputs.sdist }}
            dist/SHA256SUMS
      - name: Create the release
        id: publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WHEEL: ${{ steps.build.outputs.wheel }}
          SDIST: ${{ steps.build.outputs.sdist }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$WHEEL" "$SDIST" dist/SHA256SUMS \
            --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Tells tibia-sh/tibiawiki-mcp about the release, so its generator.yml pins the version. That workflow verifies the
  # wheel's attestation, so this job runs only once the release job has uploaded the wheel it attested. A dry run
  # publishes nothing and never gets here. A job of its own, because it mints the tibia-sh App's token in the
  # release-trigger environment, which deploys from main and v* tags alone. It checks nothing out and runs only gh
  # and jq.
  downstream:
    needs: [check, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: release-trigger
    permissions: {}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # A token of the App for tibiawiki-mcp alone, which expires within the hour. A repository_dispatch needs
      # contents write, and the token can do nothing else.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TIBIA_SH_APP_CLIENT_ID }}
          private-key: ${{ secrets.TIBIA_SH_APP_PRIVATE_KEY }}
          owner: tibia-sh
          repositories: tibiawiki-mcp
          permission-contents: write
      # gh api exits non-zero on an HTTP error and prints it, and timeout stops a request that hangs after 120
      # seconds, or kills it 10 seconds later if it ignores that. A dispatch that got through twice is harmless,
      # because generator.yml finds the version pinned or its pull request open, so a failed attempt is tried again
      # 30 seconds later, three attempts in all. Three attempts that all hang take 7.5 minutes, inside the job's 8.
      - name: Tell tibiawiki-mcp about the release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+\+tibiash\.[0-9]+$ || $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::The released version is not x.y.z+tibiash.N, or it is not the tag's."
            exit 1
          fi
          # shellcheck disable=SC2016 # $version is jq's, not the shell's
          payload='{event_type: "generator-release", client_payload: {version: $version}}'
          body="$(jq -n --arg version "$VERSION" "$payload")"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sleep 30
            fi
            if timeout --kill-after=10 120 gh api repos/tibia-sh/tibiawiki-mcp/dispatches --input - <<< "$body"; then
              echo "Told tibia-sh/tibiawiki-mcp about $VERSION in attempt $attempt."
              exit 0
            fi
          done
          echo "::error::Could not tell tibia-sh/tibiawiki-mcp about $VERSION in 3 attempts, 30 seconds apart." \
            "Run generator.yml there by hand with the version, as README.md describes."
          exit 1
